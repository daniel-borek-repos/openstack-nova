name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned dependency versions for the OpenStack 2026.2 release this source tracks.
  UPPER_CONSTRAINTS: https://releases.openstack.org/constraints/upper/2026.2

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt
      - name: Install system packages
        run: |
          python -m pip install bindep
          packages=$(bindep -b test || true)
          if [ -n "$packages" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $packages
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -c "$UPPER_CONSTRAINTS" -r requirements.txt -r test-requirements.txt -e .
          python -m pip install 'coverage[toml]'
      - name: Run unit tests with coverage
        # Mirrors the upstream "tox -e cover" environment. Test failures do not
        # block the scan, so analysis always runs on the full code base.
        continue-on-error: true
        env:
          PYTHON: coverage run --source nova --parallel-mode
          OS_TEST_PATH: ./nova/tests/unit
          OS_STDOUT_CAPTURE: '1'
          OS_STDERR_CAPTURE: '1'
          OS_TEST_TIMEOUT: '160'
          OS_NOVA_DISABLE_EVENTLET_PATCHING: 'False'
        run: |
          coverage erase
          stestr --test-path=./nova/tests/unit run --no-subunit-trace
      - name: Generate coverage report
        if: ${{ !cancelled() }}
        run: |
          coverage combine
          coverage xml -o coverage.xml
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        if: ${{ !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=daniel-borek-repos_openstack-nova
            -Dsonar.projectName=openstack-nova
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # We do not recommend to use this in a pull request. Prefer using pull request
      # decoration instead.
      # - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

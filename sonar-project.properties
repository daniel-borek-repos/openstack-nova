# Tests live inside the package (nova/tests). Main and test sources share the
# nova/ root and are split with inclusion/exclusion patterns so they stay disjoint.
sonar.sources=nova
sonar.tests=nova
sonar.exclusions=nova/tests/**,nova/locale/**
sonar.test.inclusions=nova/tests/**

# Python coverage, produced in CI by:
#     coverage combine && coverage xml -o coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11, 3.12, 3.13
